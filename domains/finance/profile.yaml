dataset:
  name: synthetic_stock_prices
  domain: finance
  table_name: stock_prices
  datetime_column: date
  sampling_frequency: daily
  description: Dataset harga saham harian sintetis untuk membuktikan workflow Q&A lintas domain.

columns:
  date:
    type: date
    semantic_type: trade_date
    description: Tanggal perdagangan.

  close_price:
    type: numeric
    unit: USD
    semantic_type: closing_price
    description: Harga penutupan harian.
    rules:
      average_sql: AVG(close_price)
      maximum_sql: MAX(close_price)
      average_alias: avg_close_price_usd
      maximum_alias: max_close_price_usd

  volume:
    type: numeric
    unit: shares
    semantic_type: trading_volume
    description: Volume perdagangan harian.
    rules:
      average_sql: AVG(volume)
      average_alias: avg_volume_shares

  return_pct:
    type: numeric
    unit: percent
    semantic_type: daily_return
    description: Return harian dalam persen.
    rules:
      average_sql: AVG(return_pct)
      average_alias: avg_return_pct

sql_rules:
  date_filter: "CAST(date AS DATE) = DATE 'YYYY-MM-DD'"
  missing_value_count: "COUNT(*) FILTER (WHERE <column> IS NULL)"
