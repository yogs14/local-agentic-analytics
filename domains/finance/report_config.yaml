report:
  enabled: true
  title: Laporan Analisis Harga Saham Harian (NVDA, NFLX, TSLA, GOOGL)
  engine: custom
  tex_path: reports/latex/finance_analysis_report.tex
  pdf_path: reports/pdf/finance_analysis_report.pdf
